SectionVerb {
	Value {
		TQ "Voice"
		Priority 1000
	}
	# Discovery selects verbs and probes PCMs, but never enables devices.
	# PCM 13 is a clocked policy endpoint with no physical/DSP ownership.
	EnableSequence [
		cset "name='Voice Call UCM Switch' 0"
	]
	DisableSequence [
		cset "name='Voice Call UCM Switch' 0"
	]
}

SectionDevice."Earpiece" {
	Comment "Cellular handset"
	ConflictingDevice [ "Speaker" ]
	EnableSequence [
		# GPIO52 switches the top amp only; mute the bottom amp separately.
		cset "name='Speaker Bottom Playback Switch' 0"
		cset "name='Speaker Top Playback Switch' 0"
		cset "name='Speaker Top Profile Set' Receiver"
		cset "name='Speaker Earpiece Switch' 1"
		cset "name='Speaker Top Playback Switch' 1"
	]
	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},13"
		PlaybackChannels 2
		PlaybackRate 48000
		PlaybackMixerElem "Speaker Top Receiver"
		PlaybackVolume "name='Speaker Top Receiver Playback Volume'"
	}
}

SectionDevice."Speaker" {
	Comment "Cellular speakerphone (experimental)"
	ConflictingDevice [ "Earpiece" ]
	EnableSequence [
		cset "name='Speaker Top Playback Switch' 0"
		cset "name='Speaker Bottom Playback Switch' 0"
		cset "name='Speaker Earpiece Switch' 0"
		cset "name='Speaker Top Profile Set' Music"
		cset "name='Speaker Bottom Profile Set' Music"
		cset "name='Speaker Bottom Playback Switch' 1"
		cset "name='Speaker Top Playback Switch' 1"
	]
	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},13"
		PlaybackChannels 2
		PlaybackRate 48000
		PlaybackMixerElem "Speaker"
		PlaybackVolume "name='Speaker Playback Volume'"
	}
}

SectionDevice."Mic" {
	Comment "Cellular primary microphone"
	EnableSequence [
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
		cset "name='TX_AIF1_CAP Mixer DEC2' 0"
		cset "name='TX_AIF1_CAP Mixer DEC4' 0"
		cset "name='TX_AIF1_CAP Mixer DEC5' 0"
		cset "name='TX_AIF1_CAP Mixer DEC6' 0"
		cset "name='TX_AIF1_CAP Mixer DEC7' 0"
		cset "name='TX DEC1 MUX' SWR_MIC"
		cset "name='TX SMIC MUX1' SWR_MIC0"
		cset "name='TX DEC3 MUX' SWR_MIC"
		cset "name='TX SMIC MUX3' SWR_MIC0"
		cset "name='DEC1 MODE' ADC_DEFAULT"
		cset "name='DEC3 MODE' ADC_DEFAULT"
		cset "name='TX_DEC1 Volume' 84"
		cset "name='TX_DEC3 Volume' 84"
		cset "name='ADC2_MIXER Switch' 0"
		cset "name='ADC3_MIXER Switch' 0"
		cset "name='ADC2 Switch' 0"
		cset "name='ADC3 Switch' 0"
		cset "name='ADC1 Switch' 1"
		cset "name='ADC4 MUX' INP5"
		cset "name='ADC4 Switch' 0"
		cset "name='TX0 MODE' ADC_NORMAL"
		cset "name='TX3 MODE' ADC_INVALID"
		cset "name='ADC1 Volume' 10"
		cset "name='ADC4 Volume' 6"
		cset "name='ADC1_MIXER Switch' 1"
		cset "name='ADC4_MIXER Switch' 0"
		cset "name='TX_AIF1_CAP Mixer DEC1' 1"
		cset "name='TX_AIF1_CAP Mixer DEC3' 1"
		cset "name='Voice Call UCM Switch' 1"
	]
	DisableSequence [
		# A failed STOP keeps physical resources; do not undo routes first.
		cset "name='Voice Call UCM Switch' 0"
		cset "name='TX_AIF1_CAP Mixer DEC1' 0"
		cset "name='TX_AIF1_CAP Mixer DEC3' 0"
		cset "name='ADC1_MIXER Switch' 0"
		cset "name='ADC4_MIXER Switch' 0"
		cset "name='ADC1 Switch' 0"
		cset "name='ADC4 Switch' 0"
		cset "name='TX0 MODE' ADC_INVALID"
		cset "name='TX3 MODE' ADC_INVALID"
		cset "name='TX SMIC MUX1' ZERO"
		cset "name='TX SMIC MUX3' ZERO"
	]
	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},13"
		CaptureChannels 2
		CaptureRate 48000
		CaptureMixerElem "TX_AIF1"
		CaptureSwitch "name='TX_AIF1 Capture Switch'"
	}
}
